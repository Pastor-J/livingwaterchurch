<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Clear Storage</title></head>
<body style="font-family:system-ui;padding:40px;text-align:center">
<h1>Clearing saved login...</h1>
<p id="status">Please wait</p>
<script>
try{
  localStorage.clear();
  sessionStorage.clear();
  // Also clear specific keys
  var keys = Object.keys(localStorage);
  for(var i=0;i<keys.length;i++){ if(keys[i].indexOf('lwc_')!==-1) localStorage.removeItem(keys[i]); }
  document.getElementById('status').innerHTML = '<b style="color:green">Cleared!</b><br><br>Now close this and open your original Index 41 file.<br>It should work now.<br><br><button onclick="window.close()" style="padding:12px 24px">Close</button>';
}catch(e){
  document.getElementById('status').innerHTML = 'Error: '+e.message+'<br><br>Try manually: F12 > Console > paste: localStorage.clear(); sessionStorage.clear(); location.reload();';
}
</script>
</body></html>
