<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Water Church</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Outfit',sans-serif; background:#0f172a;} .water-gradient{background: linear-gradient(135deg, #0e4f8c 0%, #1e88e5 50%, #42a5f5 100%);}</style>
</head>
<body class="min-h-screen flex flex-col">
<div id="app" class="flex-1 flex flex-col">

<div id="authScreen" class="min-h-screen flex items-center justify-center p-4 water-gradient">
  <div class="w-full max-w-md bg-white rounded-[32px] shadow-2xl p-8">
    <div class="text-center mb-8">
      <img id="logoImg" class="w-20 h-20 mx-auto rounded-2xl object-cover shadow-lg mb-4" alt="logo">
      <h1 class="text-3xl font-black tracking-tight text-slate-900">LIVING <span class="text-blue-600">Water</span></h1>
      <p class="text-slate-500 font-semibold tracking-widest text-xs mt-1">CHURCH</p>
      <p id="authSubtitle" class="text-slate-600 mt-4 font-medium">Welcome back, family</p>
    </div>

    <div class="flex bg-slate-100 rounded-full p-1 mb-6">
      <button id="loginTab" onclick="switchTab('login')" class="flex-1 py-2.5 rounded-full font-bold text-sm bg-slate-900 text-white shadow">Log In</button>
      <button id="signupTab" onclick="switchTab('signup')" class="flex-1 py-2.5 rounded-full font-bold text-sm text-slate-500">Sign Up</button>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Email</label>
        <input id="loginEmail" type="email" required placeholder="you@example.com" class="w-full mt-1 px-4 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none font-medium">
      </div>
      <div>
        <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Password</label>
        <input id="loginPass" type="password" required placeholder="••••••••" class="w-full mt-1 px-4 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none font-medium">
      </div>
      <button type="submit" class="w-full py-4 rounded-2xl bg-slate-900 text-white font-bold text-[15px] shadow-lg">Log In</button>
      <p class="text-center text-sm text-slate-500">First time? <span onclick="switchTab('signup')" class="text-blue-600 font-bold cursor-pointer">Create account</span></p>
    </form>

    <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-3 hidden">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-bold text-slate-700 uppercase">First Name</label>
          <input id="firstName" required placeholder="John" class="w-full mt-1 px-4 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 outline-none font-medium">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-700 uppercase">Last Name</label>
          <input id="lastName" required placeholder="Smith" class="w-full mt-1 px-4 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 outline-none font-medium">
        </div>
      </div>
      <div>
        <label class="text-xs font-bold text-slate-700 uppercase">Email</label>
        <input id="signupEmail" type="email" required placeholder="you@example.com" class="w-full mt-1 px-4 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 outline-none font-medium">
      </div>
      <div>
        <label class="text-xs font-bold text-slate-700 uppercase">Password</label>
        <input id="signupPass" type="password" required minlength="4" placeholder="Create password (4+ chars)" class="w-full mt-1 px-4 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 outline-none font-medium">
      </div>
      <button type="submit" class="w-full py-4 rounded-2xl water-gradient text-white font-bold text-[15px] shadow-lg">Create Account</button>
      <p class="text-center text-sm text-slate-500">Already have account? <span onclick="switchTab('login')" class="text-blue-600 font-bold cursor-pointer">Log in</span></p>
    </form>
    <p id="authMsg" class="text-center text-sm mt-4 font-semibold"></p>
  </div>
</div>

<div id="mainApp" class="hidden min-h-screen bg-[#f6f8fb] flex flex-col">
  <header class="water-gradient p-6 pb-10 rounded-b-[32px] shadow-lg">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-3">
        <img id="logoImg2" class="w-10 h-10 rounded-xl bg-white object-cover">
        <div><h2 class="text-white font-black leading-none">LIVING WATER</h2><p class="text-blue-100 text-xs font-bold tracking-widest">CHURCH</p></div>
      </div>
      <button onclick="logout()" class="bg-white/20 text-white px-4 py-2 rounded-full text-xs font-bold">Log out</button>
    </div>
    <h1 id="welcomeName" class="text-white text-3xl font-extrabold mt-8 leading-tight">Welcome!</h1>
    <p class="text-blue-100 mt-2 font-medium">We're glad you're here.</p>
  </header>
  <main class="p-5 -mt-6 space-y-4 max-w-lg mx-auto w-full">
    <div class="bg-white rounded-[24px] p-5 shadow-sm border border-slate-100"><h3 class="font-bold">Sunday Service</h3><p class="text-slate-600 text-sm mt-1">10:00 AM - Worship & Word</p></div>
    <div class="grid grid-cols-2 gap-4">
      <div class="bg-white rounded-[24px] p-5 shadow-sm border"><p class="text-2xl">🙏</p><h4 class="font-bold mt-2 text-sm">Prayer Request</h4></div>
      <div class="bg-white rounded-[24px] p-5 shadow-sm border"><p class="text-2xl">📖</p><h4 class="font-bold mt-2 text-sm">Sermons</h4></div>
    </div>
    <div class="bg-blue-600 rounded-[24px] p-5 text-white"><h3 class="font-bold">You are logged in as</h3><p id="profileEmail" class="text-blue-100 text-sm mt-1"></p><p id="profileFullName" class="font-semibold mt-2"></p></div>
  </main>
</div>

</div>

var LS_USERS='lwc_users'; var LS_SESSION='lwc_session';
function getUsers(){ try{return JSON.parse(localStorage.getItem(LS_USERS)||'[]')}catch(e){return []} }
function saveUsers(u){ localStorage.setItem(LS_USERS, JSON.stringify(u)) }
function switchTab(t){
  var loginForm=document.getElementById('loginForm');
  var signupForm=document.getElementById('signupForm');
  var loginTab=document.getElementById('loginTab');
  var signupTab=document.getElementById('signupTab');
  var sub=document.getElementById('authSubtitle');
  document.getElementById('authMsg').textContent='';
  if(t==='login'){
    loginForm.classList.remove('hidden'); signupForm.classList.add('hidden');
    loginTab.className='flex-1 py-2.5 rounded-full font-bold text-sm bg-slate-900 text-white shadow';
    signupTab.className='flex-1 py-2.5 rounded-full font-bold text-sm text-slate-500';
    sub.textContent='Welcome back, family';
  } else {
    signupForm.classList.remove('hidden'); loginForm.classList.add('hidden');
    signupTab.className='flex-1 py-2.5 rounded-full font-bold text-sm bg-slate-900 text-white shadow';
    loginTab.className='flex-1 py-2.5 rounded-full font-bold text-sm text-slate-500';
    sub.textContent='Create your church family account';
  }
}
function handleSignup(e){
  e.preventDefault();
  var fn=document.getElementById('firstName').value.trim();
  var ln=document.getElementById('lastName').value.trim();
  var email=document.getElementById('signupEmail').value.trim().toLowerCase();
  var pass=document.getElementById('signupPass').value;
  var msg=document.getElementById('authMsg');
  var users=getUsers();
  if(users.find(function(u){return u.email===email;})){ msg.textContent='Email already exists. Please log in.'; msg.className='text-center text-sm mt-4 font-semibold text-red-600'; return; }
  users.push({firstName:fn, lastName:ln, email:email, password:pass});
  saveUsers(users);
  localStorage.setItem(LS_SESSION, JSON.stringify({email:email, firstName:fn, lastName:ln}));
  msg.textContent='Account created!'; msg.className='text-center text-sm mt-4 font-semibold text-green-600';
  setTimeout(function(){showMain()}, 600);
}
function handleLogin(e){
  e.preventDefault();
  var email=document.getElementById('loginEmail').value.trim().toLowerCase();
  var pass=document.getElementById('loginPass').value;
  var msg=document.getElementById('authMsg');
  var users=getUsers();
  var u=users.find(function(x){return x.email===email && x.password===pass;});
  if(!u){ msg.textContent='Wrong email or password.'; msg.className='text-center text-sm mt-4 font-semibold text-red-600'; return; }
  localStorage.setItem(LS_SESSION, JSON.stringify(u));
  showMain();
}
function showMain(){
  var session=null; try{session=JSON.parse(localStorage.getItem(LS_SESSION))}catch(e){}
  if(!session) return;
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  document.getElementById('welcomeName').textContent='Welcome, '+session.firstName+'!';
  document.getElementById('profileEmail').textContent=session.email;
  document.getElementById('profileFullName').textContent=session.firstName+' '+session.lastName;
}
function logout(){
  localStorage.removeItem(LS_SESSION);
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
}
(function(){
  var s=null; try{s=JSON.parse(localStorage.getItem(LS_SESSION))}catch(e){}
  if(s) showMain();
})();
</script>
