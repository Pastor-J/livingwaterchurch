<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LWC Emergency Fix</title>
<style>body{margin:0;font-family:system-ui;background:#0e254d;color:#fff;display:grid;place-items:center;min-height:100vh;padding:20px}
.card{background:#fff;color:#000;border-radius:18px;padding:20px;max-width:400px;width:100%;text-align:center}
.btn{background:#0e4f8c;color:#fff;border:0;padding:14px;border-radius:12px;width:100%;font-weight:700;font-size:16px;cursor:pointer;margin:6px 0}
</style>
</head><body>
<div class="card">
<h2>🔧 Fix Blue Screen</h2>
<p>Your browser has a huge sermon image stuck causing blue screen.</p>
<p id="info"></p>
<button class="btn" onclick="doClear()">Tap to Clear Bad Image & Fix</button>
<button class="btn" style="background:#eef4ff;color:#0e4f8c" onclick="localStorage.clear();sessionStorage.clear();location.reload()">Clear EVERYTHING (if still stuck)</button>
<p style="font-size:12px;color:#666;margin-top:10px">After clearing, go to ?v=compress</p>
</div>
<script>
const s=localStorage.getItem('weeklySermon');
document.getElementById('info').innerText=s? 'Stuck image size: ' + Math.round(s.length/1024) + 'KB — too big!': 'No big image found — but clearing anyway';
function doClear(){
 try{
   localStorage.removeItem('weeklySermon');
   localStorage.removeItem('readVerses');
   // keep currentUser
   alert('Cleared! Now going to fixed app...');
   location.href='/livingwaterchurch/?v=compress';
 }catch(e){ alert('Error:'+e.message); localStorage.clear(); location.href='/livingwaterchurch/?v=compress'; }
}
// auto clear if huge
if(s && s.length>200000){ setTimeout(doClear, 1000); }
</script>
</body></html>
