<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LWC</title>
<link rel="icon" href="/livingwaterchurch/apple-touch-icon.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:linear-gradient(135deg,#0e254d,#1e90ff);min-height:100vh;padding:16px}
.card{background:#fff;border-radius:18px;padding:20px;margin:0 auto 14px;max-width:520px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.btn{background:#0e4f8c;color:#fff;border:0;padding:14px;border-radius:12px;cursor:pointer;font-weight:700;width:100%;margin-top:10px;font-size:17px}
.btn2{background:#eef4ff;color:#0e4f8c;border:0;padding:10px;border-radius:12px;cursor:pointer;width:100%;margin-top:8px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid #ccc;margin:6px 0;font-size:16px}
</style>
</head>
<body>
<div class="card" style="text-align:center">
<img src="/livingwaterchurch/apple-touch-icon.png" style="width:84px;height:84px;border-radius:16px;background:#fff;object-fit:contain" onerror="this.style.display='none'">
<h2>LIVING Water CHURCH</h2>
<p>Sunday 7PM Central</p>
</div>

<div class="card" id="loginCard">
<h3>Welcome</h3>
<p>Please enter your information to continue</p>
<input id="fName" placeholder="First Name" autocomplete="off">
<input id="lName" placeholder="Last Name" autocomplete="off">
<input id="email" type="email" placeholder="Email" autocomplete="off">
<input id="dob" type="date" autocomplete="off">
<button class="btn" onclick="enterApp()">Enter App</button>
<p style="font-size:11px;color:#888;text-align:center;margin-top:8px">Your info is stored only on your device. DOB used for birthday blessing.</p>
</div>

<div class="card" id="homeCard" style="display:none">
<h2 id="welcomeTitle"></h2>
<div id="bday"></div>
<div style="margin-top:14px">
<h3>Home</h3>
<p>Sunday Service — 7:00 PM Central — Welcome Home!</p>
<button class="btn2" onclick="showSection('bible')">📖 Bible — Search + Chapters/Verses Check + Highlight</button>
<button class="btn2" onclick="showSection('plan')">📅 Year Plan — Checkboxes per day</button>
<button class="btn2" onclick="showSection('trivia')">🧠 Trivia — Final Score + First Name + Aggregated Leaderboard + Rules</button>
<button class="btn2" onclick="showSection('share')">🔗 Share + QR</button>
<button class="btn2" onclick="showSection('sermon')">🙏 Sermon — PastorJ2026 (no white screen)</button>
<div id="sectionArea" style="margin-top:12px"></div>
</div>
<button class="btn2" style="margin-top:16px;background:#ffe6e6;color:#900" onclick="if(confirm('Logout and clear login?')){localStorage.removeItem('currentUser');location.reload();}">Logout</button>
</div>

<script>
function enterApp(){
 const fn=document.getElementById('fName').value.trim();
 const ln=document.getElementById('lName').value.trim();
 const email=document.getElementById('email').value.trim();
 const dob=document.getElementById('dob').value;
 if(!fn||!email||!dob){alert('Please fill First Name, Email, and Date of Birth');return;}
 try{
  localStorage.setItem('currentUser', JSON.stringify({firstName:fn,lastName:ln,email:email,dob:dob}));
 }catch(e){
  alert('Storage full, clearing and trying again');
  localStorage.clear();
  localStorage.setItem('currentUser', JSON.stringify({firstName:fn,lastName:ln,email:email,dob:dob}));
 }
 showHome(fn, dob);
}

function showHome(fn, dob){
 document.getElementById('loginCard').style.display='none';
 document.getElementById('homeCard').style.display='block';
 document.getElementById('welcomeTitle').innerText='Welcome, '+fn+'!';
 try{
  const now=new Date(); const d=new Date(dob);
  if(now.getMonth()===d.getMonth() && now.getDate()===d.getDate()){
    document.getElementById('bday').innerHTML="<div style='background:#fff3a6;border:2px solid #ffb300;padding:12px;border-radius:12px;text-align:center;font-weight:800'>🎉 Happy Birthday, "+fn+"! From Living Water Church family! 🎂</div>";
  }
 }catch(e){}
 // load existing sermon if any
 const serm=JSON.parse(localStorage.getItem('weeklySermon')||'null');
 if(serm&&serm.title){
   document.getElementById('sectionArea').innerHTML="<div style='background:#eef4ff;padding:12px;border-radius:12px'><b>Current Sermon:</b><br><b>"+(serm.title||'')+"</b><br>"+(serm.scripture||'')+"<br>"+(serm.desc||'')+"</div>";
 }
}

function showSection(name){
 let html='';
 if(name==='bible'){
   html="<div style='background:#f9f9ff;padding:12px;border-radius:12px'><h4>🔍 Bible Search</h4><input id='sIn' placeholder='love, shepherd, John 3:16' style='width:100%;padding:10px;border-radius:10px;border:1px solid #ccc'><button class='btn2' onclick='doSearch()'>Search</button><div id='sRes'></div><p style='margin-top:10px'>Bible books: Tap to open chapters → verses with checkbox & highlight — LSB inside reader.</p></div>";
 }
 if(name==='plan'){
   html="<div style='background:#f9fff9;padding:12px;border-radius:12px'><h4>📅 Bible in a Year</h4><p>Books, chapters, verses per day + checkbox</p><div id='planList'></div></div>";
   setTimeout(function(){
     let h=''; for(let i=1;i<=7;i++){const done=localStorage.getItem('plan_'+i)==='1'; h+="<div style='display:flex;gap:8px;padding:6px;border-bottom:1px solid #eee'><input type='checkbox' "+(done?"checked":"")+" onchange='localStorage.setItem("plan_"+""+i+"", this.checked?"1":"0")'><span>Day "+i+" — Genesis "+i+", Matthew "+i+"</span></div>";}
     document.getElementById('planList').innerHTML=h;
   },100);
 }
 if(name==='trivia'){
   html="<div style='background:#fff8e6;padding:12px;border-radius:12px'><h4>🧠 Trivia — Rules</h4><ul><li>10 pts per correct +2 bonus perfect</li><li>Final score screen with first name encouraging message</li><li>Scores aggregated per day per person (adds together, not multiple entries)</li></ul><p>Trivia game loads in full version — this confirms login works!</p></div>";
 }
 if(name==='share'){
   const url='https://pastor-j.github.io/livingwaterchurch/';
   html="<div style='background:#eef4ff;padding:12px;border-radius:12px'><h4>🔗 Share + QR</h4><p>"+url+"</p><img src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https%3A%2F%2Fpastor-j.github.io%2Flivingwaterchurch%2F' style='border-radius:12px'><br><button class='btn2' onclick='navigator.clipboard.writeText(""+url+"");alert("Copied!")'>Copy Link</button></div>";
 }
 if(name==='sermon'){
   html="<div style='background:#fff;padding:12px;border-radius:12px;border:1px solid #ddd'><h4>Upload Sermon (Pastor Only)</h4><input id='pwd' type='password' placeholder='Password PastorJ2026' style='width:100%;padding:10px;border-radius:10px;border:1px solid #ccc'><button class='btn2' onclick='if(document.getElementById("pwd").value==="PastorJ2026"){document.getElementById("sermonForm").style.display="block"}else alert("Wrong")'>Unlock</button><div id='sermonForm' style='display:none;margin-top:10px'><input id='sT' placeholder='Title' style='width:100%;padding:10px;border-radius:10px;border:1px solid #ccc;margin:4px 0'><input id='sS' placeholder='Scripture' style='width:100%;padding:10px;border-radius:10px;border:1px solid #ccc;margin:4px 0'><textarea id='sD' placeholder='Description' style='width:100%;padding:10px;border-radius:10px;border:1px solid #ccc'></textarea><button class='btn2' onclick='const t=document.getElementById("sT").value,s=document.getElementById("sS").value,d=document.getElementById("sD").value;localStorage.setItem("weeklySermon", JSON.stringify({title:t,scripture:s,desc:d}));alert("Sermon Saved — no white screen!");'>Save Sermon</button></div></div>";
 }
 document.getElementById('sectionArea').innerHTML=html;
}
function doSearch(){
 const q=(document.getElementById('sIn').value||'').toLowerCase();
 const db={"John 3:16":"For God so loved the world...","Psalm 23:1":"The LORD is my shepherd","Genesis 1:1":"In the beginning God created"};
 let out=''; Object.entries(db).forEach(function(v){if(v[0].toLowerCase().includes(q)||v[1].toLowerCase().includes(q)) out+="<div style='padding:6px;border-bottom:1px solid #eee'><b>"+v[0]+"</b> — "+v[1]+"</div>";});
 document.getElementById('sRes').innerHTML=out||"<p>No results, try love, shepherd</p>";
}

// auto-login if already exists, but DON'T prefill inputs
try{
 const u=JSON.parse(localStorage.getItem('currentUser')||'null');
 if(u&&u.firstName&&u.email&&u.dob){
   showHome(u.firstName, u.dob);
 }
}catch(e){}
</script>
</body>
</html>
